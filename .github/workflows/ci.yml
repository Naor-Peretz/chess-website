name: CI

on:
  push:
    branches: [main, master]
  # No base-branch filter: stacked PRs target another feature branch rather
  # than main, and would otherwise merge with no CI having run at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Schema validation and Prisma client generation only need a well-formed URL,
  # never a reachable database.
  PLACEHOLDER_DATABASE_URL: 'postgresql://user:pass@localhost:5432/test_db'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version is read from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linting
        run: pnpm lint

      - name: Check for deprecated packages
        run: node scripts/check-dependencies.js

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @chess-website/backend exec prisma validate
        env:
          DATABASE_URL: ${{ env.PLACEHOLDER_DATABASE_URL }}

      - name: Generate Prisma client
        run: pnpm --filter @chess-website/backend exec prisma generate
        env:
          DATABASE_URL: ${{ env.PLACEHOLDER_DATABASE_URL }}

      - name: Build all packages
        run: pnpm build

      # pnpm -r rather than turbo: turbo does not forward the secrets below.
      - name: Run tests
        run: pnpm -r test
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: 'test-jwt-secret-for-ci'
          TEST_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
          FRONTEND_URL: 'http://localhost:3000'

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for gitleaks history scanning

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory, not a gate. Every current high-severity finding is transitive
      # through @prisma/client, @sentry/nextjs, or the Next toolchain and has no
      # fix this repo controls. Dependabot security updates open PRs for them as
      # upstream releases land; CodeQL is the blocking gate for first-party code.
      - name: Dependency audit (advisory)
        run: |
          {
            echo '## Dependency audit'
            echo
            echo '```'
            pnpm audit --audit-level=high 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: License compliance check
        run: npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;Unlicense;0BSD;CC-BY-4.0;Python-2.0;BlueOak-1.0.0' --summary

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @chess-website/frontend exec playwright install --with-deps chromium

      # The backend postinstall generates the Prisma client, so build works here
      # without an explicit generate step.
      - name: Build all packages
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm --filter @chess-website/frontend exec playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7

  smoke:
    name: Post-deploy smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, build-test, security, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Render redeploys asynchronously after a merge, so poll rather than
      # curling once and testing whatever the previous deploy left running.
      - name: Wait for backend health
        run: |
          URL="https://chess-website-cm4y.onrender.com/health"
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}, retrying in 20s"
            sleep 20
          done
          echo "Backend did not report healthy within 10 minutes"
          exit 1
