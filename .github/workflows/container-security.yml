name: Container Security Scan

on:
  push:
    branches: [main, master]
    paths:
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/container-security.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/container-security.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Dockerfile misconfigurations are ours to fix, so these block.
      - name: Scan Dockerfile configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'apps/backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Dependency CVEs mostly come from upstream images and transitive packages.
      # Block only on critical findings that actually have a fix available;
      # Dependabot handles the rest.
      - name: Scan backend dependencies
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
