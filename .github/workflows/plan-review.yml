name: Plan Review

# Reviews plan files on PRs and posts the result as a comment ending in a
# VERDICT: line that .claude/scripts/check-plan-review.sh parses.
#
# PR-only by design: the previous version also ran on pushes to plan/**, where
# it burned a full review and then discarded it, because comments can only be
# posted against a PR.
on:
  pull_request:
    paths:
      # Plan documents only. A looser '**/plan-*.md' also matched
      # .claude/agents/plan-reviewer.md and fired on every tooling change.
      - 'dev/**/*-plan.md'
      - 'dev/**/plan.md'
      - '**/*.plan.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review plans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action mints its GitHub token over OIDC; without this it
      # fails with "Could not fetch an OIDC token".
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed plan files
        id: plans
        run: |
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
            | grep -E '^dev/.*(-plan|/plan)\.md$|\.plan\.md$' || true)

          # A file can appear in the diff and be deleted by a later commit.
          existing=""
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] && existing="${existing}${f}"$'\n'
          done <<< "$changed"
          existing=$(printf '%s' "$existing" | head -5)

          if [ -z "$existing" ]; then
            echo "No plan files changed in this PR"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Reviewing:"; echo "$existing"
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<PLANS_EOF"
              echo "$existing"
              echo "PLANS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Review with Claude
        if: steps.plans.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow token rather than exchanging an app token. Without
          # this the action requires the Claude GitHub App to be installed on
          # the repository (https://github.com/apps/claude) and fails 401.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 5 turns was enough for the old prompt, which only read the plan
          # text inline. This one reads CLAUDE.md and the source the plan names,
          # which costs a turn each — a real review of a large plan measured 32
          # turns and ~13 minutes. timeout-minutes is the backstop.
          claude_args: '--model opus --max-turns 60'
          prompt: |
            Review the implementation plan(s) in these files, using the
            plan-reviewer agent definition at .claude/agents/plan-reviewer.md
            as your standard:

            ${{ steps.plans.outputs.files }}

            This is the chess-website monorepo: pnpm workspaces and Turborepo,
            Next.js 16 App Router frontend, Express 5 and Prisma 7 backend,
            PostgreSQL on Supabase. Read CLAUDE.md and the code the plan names
            before judging it — most bad plans are internally consistent and
            wrong about one fact regarding this codebase.

            Report blocking issues first, then gaps, then smaller notes. Cite
            file:line. Only raise genuine problems; if the plan is sound, say so.

            Post your review as a PR comment whose first line is exactly:

            ## Claude Plan Review

            End the comment with exactly one line, nothing after it:

            VERDICT: APPROVED

            or `VERDICT: NEEDS REVISION`, or `VERDICT: MAJOR CHANGES NEEDED`.
            Tooling greps for that line, so it must appear verbatim and once.
